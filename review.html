<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>WanderAlt — Review queue</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="./brand/favicon/favicon.svg" />
  <link rel="stylesheet" href="wa.css" />
  <script src="./theme.js"></script>
  <script defer src="./ui-helpers.js"></script>
  <script defer src="./review.js"></script>
</head>
<body data-page="review">
  <header class="wa-topbar" role="banner">
    <a class="wa-topbar__brand" href="./index.html">
      <img class="wa-topbar__mark" src="./brand/masters/tile.svg" alt="" width="26" height="26" />
      <span>WanderAlt</span>
    </a>
  </header>
  <main class="wa-shell" id="main">
    <h1 class="wa-display" style="margin-top:var(--s-7)">Review queue</h1>
    <p class="wa-detail__note">Events the pipeline held back. Publish what belongs, reject what does not; the pipeline never changes a decision made here.</p>
    <form class="wa-field" id="key-form" data-no-submit style="margin-top:var(--s-5)">
      <label class="wa-field__label" for="key">Supabase secret key</label>
      <input class="wa-input" id="key" type="password" autocomplete="off" placeholder="sb_secret_…" />
      <p class="wa-detail__note">Kept in this tab only (sessionStorage) and sent only to Supabase.</p>
      <button class="wa-btn wa-btn--primary" type="submit">Open the queue</button>
    </form>
    <div id="queue"></div>
  </main>
</body>
</html>
