# Posts to Threads and Instagram, or checks the tokens. Manual only: nothing
# here runs on a schedule, and nothing is posted unless "publish" is chosen.
name: social

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to run'
        type: choice
        options: [check, tonight-preview, tonight-threads]
        default: check

concurrency:
  group: social
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Run
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          ACTION: ${{ inputs.action }}
        run: |
          case "$ACTION" in
            check) node pipeline/social.ts check ;;
            tonight-preview) node pipeline/social.ts tonight ;;
            tonight-threads) node pipeline/social.ts tonight --publish threads ;;
          esac
