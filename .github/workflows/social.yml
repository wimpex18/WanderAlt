# Posts to Threads and Facebook, or checks the social tokens. Only `check` runs on a
# schedule (twice a month, which keeps the 60-day Threads token refreshed) and it
# posts nothing; posting requires an explicitly selected manual action.
name: social

on:
  schedule:
    - cron: '17 6 1,15 * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'What to run'
        type: choice
        options: [check, tonight-preview, tonight-threads, tonight-facebook]
        default: check

concurrency:
  group: social
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Run
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          ACTION: ${{ inputs.action || 'check' }}
        run: |
          case "$ACTION" in
            check) node pipeline/social.ts check ;;
            tonight-preview) node pipeline/social.ts tonight ;;
            tonight-threads) node pipeline/social.ts tonight --publish threads ;;
            tonight-facebook) node pipeline/social.ts tonight --publish facebook ;;
          esac
