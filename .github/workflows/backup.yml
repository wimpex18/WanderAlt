# A weekly logical backup of the curated and user-made tables to the private Storage bucket
# `backups` (newest 12 kept). Restore steps: README.md, "Deployment and data".
name: backup

on:
  schedule:
    - cron: '35 3 * * 0'
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Back up
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node pipeline/backup.ts
