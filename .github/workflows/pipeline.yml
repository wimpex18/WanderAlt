# Collects Tallinn events into Supabase. A red run means a source failed or
# came back empty; the log names it.
name: pipeline

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Run one source only (id from pipeline/sources.tallinn.json)'
        required: false

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Run the pipeline
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node pipeline/run.ts ${{ inputs.source && format('--source {0}', inputs.source) || '' }}
