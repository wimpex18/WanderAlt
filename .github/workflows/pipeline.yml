# Collects Tallinn events into Supabase. A red run means a source failed or
# came back empty; the log names it.
name: pipeline

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Run one source only (id from pipeline/sources.tallinn.json)'
        required: false

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Install DuckDB (reads Overture Maps places)
        run: |
          curl -fsSL https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip -o duckdb.zip
          mkdir -p "$HOME/.local/bin" && unzip -o -q duckdb.zip -d "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run the pipeline
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WORKERS_AI_DAILY_NEURONS: ${{ secrets.WORKERS_AI_DAILY_NEURONS }}
        run: node pipeline/run.ts ${{ inputs.source && format('--source {0}', inputs.source) || '' }}
