# Writes the in-app inbox and sends push (pipeline/digest.ts). Daily: change notes
# as they appear, the weekly note Thursday to Saturday, the 16:00 tonight note as
# a push. Push needs the VAPID pair; email stays off without RESEND_API_KEY.
name: digest

on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print what would be sent, send nothing'
        type: boolean
        default: true
      weekly:
        description: 'Send the weekly digest even on a day it does not go out'
        type: boolean
        default: false

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Send
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node pipeline/digest.ts ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }} ${{ inputs.weekly && '--weekly' || '' }}
