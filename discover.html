<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>WanderAlt — Tonight · Tallinn</title>
  <meta name="description" content="What's on tonight in Tallinn, soonest first, with a walking distance on every row." />
  <meta name="theme-color" content="#f2efe6" />
  <link rel="icon" type="image/svg+xml" href="./brand/favicon/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="./favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="./brand/favicon/apple-touch-icon.png" />
  <link rel="mask-icon" href="./brand/favicon/safari-pinned-tab.svg" color="#055959" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="canonical" href="https://wanderalt.app/discover.html" />

  <meta property="og:type"        content="website" />
  <meta property="og:site_name"   content="WanderAlt" />
  <meta property="og:title"       content="WanderAlt — Tonight" />
  <meta property="og:description" content="What's on tonight, soonest first, with a walking distance on every row." />
  <meta property="og:image"       content="./brand/social/og-default.png" />
  <meta name="twitter:card"       content="summary_large_image" />

  <link rel="preload" as="font" type="font/woff2" href="fonts/fraunces-600.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="fonts/inter-600.woff2" crossorigin />

  <link rel="stylesheet" href="wa.css" />
  <link rel="stylesheet" href="./vendor/maplibre-gl.css" />
  <script src="./theme.js"></script>
  <script defer src="./when.js"></script>
  <script defer src="./catalog.js"></script>
  <script defer src="./geo.js"></script>
  <script defer src="./hours.js"></script>
  <script defer src="./marks.js"></script>
  <script defer src="./seen.js"></script>
  <script defer src="./share.js"></script>
  <script defer src="./offline.js"></script>
  <script defer src="./ui-helpers.js"></script>
  <script defer src="./city.js"></script>
  <script defer src="./supabase.js"></script>
  <script defer src="./auth.js"></script>
  <script defer src="./bookmark.js"></script>
  <script defer src="./maplibre-loader.js"></script>
  <script defer src="./map-tiles.js"></script>
  <script defer src="./view-transition.js"></script>
  <script defer src="./tonight.js"></script>
</head>
<body data-page="tonight">

  <a class="wa-sr" href="#main">Skip to content</a>

  <header class="wa-topbar" role="banner">
    <a class="wa-topbar__brand" href="./index.html">
      <img class="wa-topbar__mark" src="./brand/masters/tile.svg" alt="" width="26" height="26" />
      <span>WanderAlt</span>
    </a>
    <a class="wa-btn wa-btn--quiet" href="./profile.html" id="tonight-account">Sign in</a>
  </header>

  <main class="wa-shell" id="main">

    <!-- The capsule collapses here to the current answers as chips.
         Tapping any of them opens the sheet on that question — same model
         as Explore, so there is still exactly one place to change what
         you are looking at. -->
    <div class="wa-scope tonight-scope" id="scope" aria-label="Current filters">
      <button class="wa-scope__chip" type="button" data-slot="where" id="chip-where">Tallinn</button>
      <button class="wa-scope__chip" type="button" data-slot="when"  id="chip-when">Tonight</button>
      <button class="wa-scope__chip" type="button" data-slot="what"  id="chip-what">Anything</button>
    </div>

    <div class="tonight-controls">
      <button class="wa-btn" type="button" id="open-filters">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        Filters<span class="wa-chip__count" id="filter-count" hidden></span>
      </button>
      <button class="wa-btn" type="button" id="toggle-map" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m9 4 6 2 5-2v14l-5 2-6-2-5 2V6z"/><path d="M9 4v14M15 6v14"/></svg>
        <span id="toggle-map-label">Map</span>
      </button>
    </div>

    <!-- The headline is a count, not a title. It answers the question the
         reader arrived with, and it is generated, so it never leaves a
         hole when a photo or a hero pick is missing. -->
    <!-- The seven-day density strip (1b, re-housed as Tonight's header
         by 5b). It says what a list cannot: which nights are worth
         waiting for. Renders above the headline because it frames the
         count rather than annotating it. -->
    <ul class="wa-density" id="density" aria-label="The next seven days"></ul>

    <h1 class="wa-headline" id="results-title">Reading the sources</h1>
    <p class="wa-section-sub" id="results-sub">ONE MOMENT</p>

    <div class="tonight-split" id="split">
      <div class="tonight-list" id="list-pane">
        <ul class="wa-rows" id="rows"></ul>
      </div>

      <!-- Companion column from 1024 up (6f); a full-screen mode below
           that. One map either way, never two implementations. -->
      <div class="tonight-map" id="map-pane" hidden>
        <div class="tonight-map__canvas" id="map-canvas"></div>
        <button class="wa-btn wa-map-refresh" type="button" id="search-area" hidden>Search this area</button>
        <div class="tonight-map__bar" id="map-bar">
          <span class="wa-fact wa-fact--strong" id="map-count"></span>
          <button class="wa-btn wa-btn--quiet" type="button" id="show-list">Show list</button>
        </div>
      </div>
    </div>

  </main>

  <nav class="wa-tabbar" aria-label="Primary">
    <a class="wa-tabbar__item" href="./index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>Explore
    </a>
    <a class="wa-tabbar__item" href="./discover.html" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Tonight
    </a>
    <a class="wa-tabbar__item" href="./saved.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Saved
    </a>
    <a class="wa-tabbar__item" href="./profile.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>You
    </a>
  </nav>

  <dialog class="wa-sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="wa-sheet__panel">
      <div class="wa-sheet__head">
        <h2 class="wa-sheet__title" id="sheet-title">Filters</h2>
        <button class="wa-sheet__close" type="button" id="sheet-close" aria-label="Close">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="wa-sheet__body" id="sheet-body"></div>
      <div class="wa-sheet__foot" id="sheet-foot"></div>
    </div>
  </dialog>

</body>
</html>
