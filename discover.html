<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Programme · WanderAlt Tallinn</title>
  <meta name="description" content="The week in Tallinn's independent scene, day by day, with a walking distance on every listing." />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" type="image/svg+xml" href="./brand/favicon/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="./favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="./brand/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="canonical" href="https://wanderalt.app/discover.html" />

  <meta property="og:type"        content="website" />
  <meta property="og:site_name"   content="WanderAlt" />
  <meta property="og:title"       content="Programme · WanderAlt Tallinn" />
  <meta property="og:description" content="The week in Tallinn's independent scene, day by day, with a walking distance on every listing." />
  <meta property="og:image"       content="./brand/social/og-default.png" />
  <meta name="twitter:card"       content="summary_large_image" />

  <!-- Geologica carries Latin, Estonian and Cyrillic; only the latin
       subset is preloaded, the others load by unicode-range. -->
  <link rel="preload" as="font" type="font/woff2" href="fonts/geologica-latin.woff2" crossorigin />
  <link rel="stylesheet" href="wa.css" />
  <!-- Pre-paint, so there is no flash of the wrong theme. -->
  <script src="./theme.js"></script>
  <script defer src="./icons.js"></script>
  <script defer src="./when.js"></script>
  <script defer src="./geo.js"></script>
  <script defer src="./hours.js"></script>
  <script defer src="./offline.js"></script>
  <script defer src="./ui-helpers.js"></script>
  <script defer src="./city.js"></script>
  <script defer src="./supabase.js"></script>
  <script defer src="./auth.js"></script>
  <script defer src="./bookmark.js"></script>
  <script defer src="./lists.js"></script>
  <script defer src="./follow.js"></script>
  <script defer src="./seen.js"></script>
  <script defer src="./toast.js"></script>
  <script defer src="./render.js"></script>
  <script defer src="./view-transition.js"></script>
  <script defer src="./tabbar.js"></script>
  <script defer src="./finder.js"></script>
  <script defer src="./ask.js"></script>
  <script defer src="./programme.js"></script>
</head>
<body data-page="programme">

  <a class="wa-sr" href="#main">Skip to content</a>

  <header class="wa-topbar" role="banner">
    <a class="wa-brand" href="./index.html" aria-label="WanderAlt, Tallinn tonight">
      <svg class="wa-brand__mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#d83a14"/><path d="M8.5 19a7.5 7.5 0 0 1 15 0z" fill="#fff"/><path d="M6 22.5h20M10 26.5h12" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="23.5" cy="9" r="1.6" fill="#fff"/></svg>
      <span>wanderalt</span>
    </a>
    <div class="wa-topbar__end">
      <a class="wa-iconbtn" href="./profile.html" id="account" aria-label="You"><svg class="wa-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg></a>
    </div>
  </header>

  <main class="wa-shell" id="main">
    <header class="wa-pagehead">
      <div class="wa-pagehead__row">
        <h1 class="wa-h1" id="prog-title">Programme</h1>
        <a class="wa-iconbtn wa-iconbtn--line" href="./map.html" id="to-map" aria-label="Show on the map"><svg class="wa-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 4.5-5 2v13l5-2 6 2 5-2v-13l-5 2z"/><path d="M9 4.5v13M15 6.5v13"/></svg></a>
      </div>
    </header>

    <div class="prog-controls" id="prog-controls">
      <form class="wa-ask" role="search" id="search-form" autocomplete="off">
        <label class="wa-sr" for="q">Ask or search the programme</label>
        <span class="wa-ask__mark"><svg class="wa-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M11 3.5c.7 4.3 2.9 6.5 7.2 7.2-4.3.7-6.5 2.9-7.2 7.2-.7-4.3-2.9-6.5-7.2-7.2 4.3-.7 6.5-2.9 7.2-7.2z"/><path d="M18.5 15c.3 1.6 1 2.3 2.6 2.6-1.6.3-2.3 1-2.6 2.6-.3-1.6-1-2.3-2.6-2.6 1.6-.3 2.3-1 2.6-2.6z"/></svg></span>
        <input class="wa-ask__input" id="q" name="q" type="search" enterkeyhint="search" autocomplete="off" spellcheck="false" placeholder="Ask for a night out" aria-describedby="ask-note" />
        <button class="wa-iconbtn wa-ask__clear" type="button" id="q-clear" aria-label="Clear" hidden><svg class="wa-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <button class="wa-iconbtn wa-ask__filters" type="button" id="open-filters" aria-label="Filters"><svg class="wa-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span class="prog-badge" id="filter-count" hidden></span></button>
      </form>
      <div class="wa-ask__try wa-chips wa-chips--scroll" id="ask-try" hidden></div>
      <div class="wa-chips wa-chips--scroll prog-quick" id="quick" role="group" aria-label="When and what"></div>
      <p class="prog-ask" id="ask-note" aria-live="polite" hidden></p>
    </div>

    <div class="prog-layout">
      <aside class="prog-aside" id="aside" aria-label="Filters"></aside>
      <div class="prog-list">
        <div class="prog-summary"><p class="prog-summary__text" id="summary" aria-live="polite"></p></div>
        <div id="list"></div>
      </div>
    </div>
  </main>

  <nav class="wa-tabbar" aria-label="Primary">
    <a class="wa-tabbar__item" href="./index.html"><svg class="wa-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg>Tonight</a>
    <a class="wa-tabbar__item" href="./discover.html" aria-current="page"><svg class="wa-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg>Programme</a>
    <a class="wa-tabbar__item" href="./map.html"><svg class="wa-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 4.5-5 2v13l5-2 6 2 5-2v-13l-5 2z"/><path d="M9 4.5v13M15 6.5v13"/></svg>Map</a>
    <a class="wa-tabbar__item" href="./places.html"><svg class="wa-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9.5 5.5 4h13L20 9.5M4 9.5h16M4 9.5a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0 2.7 2.7 0 0 0 5.3 0M5.5 12v8.5h13V12M10 20.5v-5h4v5"/></svg>Places</a>
    <a class="wa-tabbar__item" href="./saved.html"><svg class="wa-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.5 3.5h11v17L12 16.6 6.5 20.5z"/></svg>Saved</a>
  </nav>

  <dialog class="wa-sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="wa-sheet__panel">
      <div class="wa-sheet__head">
        <h2 class="wa-sheet__title" id="sheet-title">Filters</h2>
        <button class="wa-sheet__close" type="button" id="sheet-close" aria-label="Close"><svg class="wa-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="wa-sheet__body" id="sheet-body"></div>
      <div class="wa-sheet__foot" id="sheet-foot"></div>
    </div>
  </dialog>

</body>
</html>
