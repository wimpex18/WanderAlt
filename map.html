    <h1 class="wa-sr">Map of tonight in Tallinn</h1>
    <div class="map-canvas" id="map-canvas"></div>
    <div class="map-pins" id="map-pins"></div>
    <div class="map-top">
      <div class="map-seg" id="map-seg" role="group" aria-label="Show">
        <button class="map-seg__opt" type="button" data-layer="all" aria-pressed="true">All</button>
        <button class="map-seg__opt" type="button" data-layer="events" aria-pressed="false">Events<span class="map-seg__n" id="n-events"></span></button>
        <button class="map-seg__opt" type="button" data-layer="places" aria-pressed="false">Places<span class="map-seg__n" id="n-places"></span></button>
      </div>
      <label class="map-when"><span class="wa-sr">When</span>
        <select id="map-when">
          <option value="tonight">Tonight</option>
          <option value="tomorrow">Tomorrow</option>
          <option value="weekend">Weekend</option>
          <option value="thisweek">This week</option>
        </select>
      </label>
    </div>
    <div class="map-preview" id="preview" data-open="false"></div>
    <button class="map-ctrl map-locate" type="button" id="locate" aria-label="Show where I am"><svg class="wa-ic" viewBox="0 0 24 24" aria-hidden="true" data-ic="locate"><circle class="t" cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22"/></svg></button>

      <div class="map-drawer__grip" id="drawer-grip">
        <button class="map-drawer__handle" type="button" id="drawer-toggle" aria-expanded="false" aria-controls="drawer-list">
          <span><span class="map-drawer__title" id="drawer-title">In view</span><br><span class="map-drawer__sub" id="drawer-sub">Reading the sources</span></span>
        </button>
      </div>
      <div class="map-drawer__list" id="drawer-list"></div>
    </section>
  </main>
