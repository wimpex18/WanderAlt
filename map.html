<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Map · WanderAlt Tallinn</title>
  <meta name="description" content="Tonight's events and the places open now in Tallinn, on one map, sorted by walking time." />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" type="image/svg+xml" href="./brand/favicon/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="./favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="./brand/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="canonical" href="https://wanderalt.app/map.html" />

  <meta property="og:type"        content="website" />
  <meta property="og:site_name"   content="WanderAlt" />
  <meta property="og:title"       content="Map · WanderAlt Tallinn" />
  <meta property="og:description" content="Tonight's events and the places open now in Tallinn, on one map, sorted by walking time." />
  <meta property="og:image"       content="./brand/social/og-default.png" />
  <meta name="twitter:card"       content="summary_large_image" />

  <!-- Geologica carries Latin, Estonian and Cyrillic; only the latin
       subset is preloaded, the others load by unicode-range. -->
  <link rel="preload" as="font" type="font/woff2" href="fonts/geologica-latin.woff2" crossorigin />
  <link rel="stylesheet" href="wa.css" />
  <link rel="stylesheet" href="./vendor/maplibre-gl.css" />
  <!-- Pre-paint, so there is no flash of the wrong theme. -->
  <script src="./theme.js"></script>
  <script defer src="./icons.js"></script>
  <script defer src="./when.js"></script>
  <script defer src="./geo.js"></script>
  <script defer src="./hours.js"></script>
  <script defer src="./offline.js"></script>
  <script defer src="./ui-helpers.js"></script>
  <script defer src="./city.js"></script>
  <script defer src="./supabase.js"></script>
  <script defer src="./auth.js"></script>
  <script defer src="./bookmark.js"></script>
  <script defer src="./lists.js"></script>
  <script defer src="./follow.js"></script>
  <script defer src="./seen.js"></script>
  <script defer src="./toast.js"></script>
  <script defer src="./render.js"></script>
  <script defer src="./view-transition.js"></script>
  <script defer src="./maplibre-loader.js"></script>
  <script defer src="./map-tiles.js"></script>
  <script defer src="./map.js"></script>
</head>
<body data-page="map">

  <a class="wa-sr" href="#main">Skip to content</a>

  <header class="wa-topbar" role="banner">
    <a class="wa-brand" href="./index.html" aria-label="WanderAlt, Tallinn tonight">
      <svg class="wa-brand__mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="currentColor"/><circle cx="16" cy="18" r="7.5" fill="#ff4d17"/><rect x="0" y="18" width="32" height="14" rx="0" fill="currentColor"/><path d="M7 22.5h18M10.5 26h11" stroke="#ff4d17" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Wander<span class="wa-brand__alt">Alt</span></span><span class="wa-brand__city">Tallinn</span>
    </a>
    <div class="wa-topbar__end">
      <a class="wa-iconbtn" href="./discover.html?focus=search" aria-label="Search the programme"><svg class="wa-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/></svg></a>
      <a class="wa-iconbtn" href="./profile.html" id="account" aria-label="You"><svg class="wa-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg></a>
    </div>
  </header>

  <main class="map-page" id="main">
    <h1 class="wa-sr">Map of tonight in Tallinn</h1>
    <div class="map-canvas" id="map-canvas"></div>
    <div class="map-pins" id="map-pins"></div>
    <div class="map-top">
      <button class="map-layer" type="button" id="layer-events" aria-pressed="true"><span class="map-layer__key map-layer__key--event" aria-hidden="true"></span>Events<span class="wa-chip__n" id="n-events"></span></button>
      <button class="map-layer" type="button" id="layer-places" aria-pressed="true"><span class="map-layer__key map-layer__key--place" aria-hidden="true"></span>Places<span class="wa-chip__n" id="n-places"></span></button>
      <label class="map-when"><span class="wa-sr">When</span>
        <select id="map-when">
          <option value="tonight">Tonight</option>
          <option value="tomorrow">Tomorrow</option>
          <option value="weekend">This weekend</option>
          <option value="thisweek">This week</option>
        </select>
      </label>
    </div>
    <button class="wa-iconbtn map-locate" type="button" id="locate" aria-label="Show where I am"><svg class="wa-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22"/></svg></button>
    <section class="map-drawer" id="drawer" data-open="false" aria-label="In view">
      <button class="map-drawer__handle" type="button" id="drawer-toggle" aria-expanded="false" aria-controls="drawer-list">
        <span><span class="map-drawer__title" id="drawer-title">In view</span><br><span class="map-drawer__sub" id="drawer-sub">Reading the sources</span></span>
        <svg class="wa-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="map-drawer__list" id="drawer-list"></div>
    </section>
  </main>

  <nav class="wa-tabbar" aria-label="Primary">
    <a class="wa-tabbar__item" href="./index.html"><svg class="wa-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg>Tonight</a>
    <a class="wa-tabbar__item" href="./discover.html"><svg class="wa-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg>Programme</a>
    <a class="wa-tabbar__item" href="./map.html" aria-current="page"><svg class="wa-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 4.5-5 2v13l5-2 6 2 5-2v-13l-5 2z"/><path d="M9 4.5v13M15 6.5v13"/></svg>Map</a>
    <a class="wa-tabbar__item" href="./places.html"><svg class="wa-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9.5 5.5 4h13L20 9.5M4 9.5h16M4 9.5a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0 2.7 2.7 0 0 0 5.3 0M5.5 12v8.5h13V12M10 20.5v-5h4v5"/></svg>Places</a>
    <a class="wa-tabbar__item" href="./saved.html"><svg class="wa-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.5 3.5h11v17L12 16.6 6.5 20.5z"/></svg>Saved</a>
  </nav>

</body>
</html>
